name: Issue message

on:
  issues:
    types: [opened]

jobs:
  post-issue-message:
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Post welcome message on new issues
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const repo = context.repo;

            const body = [
              "## Thanks for opening an issue",
              "",
              `**Issue:** ${issue.html_url}`,
              `**Author:** @${issue.user.login}`,
              "",
              "When reporting a bug or requesting a feature for **bionmf**, please include:",
              "",
              "- [ ] A minimal reproducible example (data + code)",
              "- [ ] Your R version (`sessionInfo()`)",
              "- [ ] The `bionmf` version or commit you are using",
              "- [ ] Expected vs actual behavior",
              "",
              "For workshop participants: link this issue to your fork or PR if relevant.",
              "",
              "_This message was posted automatically by GitHub Actions._"
            ].join("\n");

            await github.rest.issues.createComment({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: issue.number,
              body: body
            });
