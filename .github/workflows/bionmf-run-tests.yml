name: bionmf — run tests

on:
  push:
    branches: [main, master]
    paths:
      - "Exercises/3_Actions_Package/**"
      - ".github/workflows/bionmf-run-tests.yml"
  pull_request:
    paths:
      - "Exercises/3_Actions_Package/**"
      - ".github/workflows/bionmf-run-tests.yml"

defaults:
  run:
    working-directory: Exercises/3_Actions_Package

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::rcmdcheck
          needs: check
          working-directory: Exercises/3_Actions_Package

      - name: Run testthat tests
        uses: r-lib/actions/test-package@v2
        with:
          error-on: warning
          working-directory: Exercises/3_Actions_Package
