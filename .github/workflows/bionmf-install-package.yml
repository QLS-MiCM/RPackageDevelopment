name: bionmf — install package

on:
  push:
    branches: [main, master]
    paths:
      - "Exercises/3_Actions_Package/**"
      - ".github/workflows/bionmf-install-package.yml"
  pull_request:
    paths:
      - "Exercises/3_Actions_Package/**"
      - ".github/workflows/bionmf-install-package.yml"

defaults:
  run:
    working-directory: Exercises/3_Actions_Package

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          extra-packages: any::knitr, any::rmarkdown
          working-directory: Exercises/3_Actions_Package

      - name: Build source package
        run: R CMD build .

      - name: Install built package
        run: R CMD INSTALL bionmf_*.tar.gz

      - name: Verify installed package loads
        run: Rscript -e 'library(bionmf); stopifnot(exists("run_nmf"))'
